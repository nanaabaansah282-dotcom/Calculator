<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-400 w-full">
    <div class="flex flex-col">
        <h1 class="text-4xl font-bold mb-20">My Calculator</h1>
        <div class="w-full max-w-xs p-4 rounded-lg bg-black text-white">
            <div id="display" class="flex items-center justify-end px-2 text-black text-xl h-[50px] m-2 border-2 bg-white rounded-lg overflow-hidden"></div>
            <div class="grid grid-cols-4 gap-2" id="keys">
                <button type="button" data-action="clear" class="col-span-3 p-3 rounded-lg bg-red-400 hover:bg-red-600 transition duration-300 active:scale-95">C</button>
                <button type="button" data-value="/" data-action="operator"  class="p-3 rounded-lg bg-gray-600 hover:bg-gray-800 transition duration-300 active:scale-95">/</button>
                <button type="button" data-value="7" data-action="digit" class="p-3 rounded-lg bg-gray-400 hover:bg-gray-500 transition duration-300 active:scale-95">7</button>
                <button type="button" data-value="8" data-action="digit" class="p-3 rounded-lg bg-gray-400 hover:bg-gray-500 transition duration-300 active:scale-95">8</button>
                <button type="button" data-value="9" data-action="digit" class="p-3 rounded-lg bg-gray-400 hover:bg-gray-500 transition duration-300 active:scale-95">9</button>
                <button type="button" data-value="*" data-action="operator" class="p-3 rounded-lg bg-gray-600 p-2  hover:bg-gray-800 transition duration-300 active:scale-95">*</button>
                <button type="button" data-value="4" data-action="digit" class="p-3 rounded-lg bg-gray-400 hover:bg-gray-500 transition duration-300 active:scale-95">4</button>
                <button type="button" data-value="5" data-action="digit" class="p-3 rounded-lg bg-gray-400 hover:bg-gray-500 transition duration-300 active:scale-95">5</button>
                <button type="button" data-value="6" data-action="digit" class="p-3 rounded-lg bg-gray-400 hover:bg-gray-500 transition duration-300 active:scale-95">6</button>
                <button type="button" data-value="-" data-action="operator"  class="p-3 rounded-lg bg-gray-600 p-2 hover:bg-gray-800 transition duration-300 active:scale-95">-</button>
                <button type="button" data-value="1" data-action="digit" class="p-3 rounded-lg bg-gray-400 hover:bg-gray-500 transition duration-300 active:scale-95">1</button>
                <button type="button" data-value="2" data-action="digit" class="p-3 rounded-lg bg-gray-400 hover:bg-gray-500 transition duration-300 active:scale-95">2</button>
                <button type="button" data-value="3" data-action="digit" class="p-3 rounded-lg bg-gray-400 hover:bg-gray-500 transition duration-300 active:scale-95">3</button>
                <button type="button" data-action="operator" data-value="+"  class="p-3 rounded-lg bg-gray-600 p-2 hover:bg-gray-800 transition duration-300 active:scale-95">+</button>
                <button type="button" data-value="0" data-action="digit" class="col-span-2 p-3 rounded-lg bg-gray-400 hover:bg-gray-500 transition duration-300 active:scale-95">0</button>
                <button type="button" data-value="." data-action="digit" class="p-3 rounded-lg bg-gray-400 hover:bg-gray-500 transition duration-300 active:scale-95">.</button>
                <button type="button" data-action="equals"  class="p-3 rounded-lg bg-green-400 hover:bg-green-600 transition duration-300 active:scale-95">=</button>
            </div>
        </div>
    </div>
    
    
    <script src="script.js"></script>
</body>
</html>
